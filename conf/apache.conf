# Included into the Heroku Apache vhost via the -C flag in the Procfile.
#
# Compression is the single biggest win for this site: style.css is 42KB raw
# and 9.6KB gzipped. Without it, the stylesheet blocks render for ~450ms on a
# throttled mobile connection and Lighthouse Performance lands at 99 instead
# of 100. Measured, not guessed.
<IfModule mod_deflate.c>
	AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css
	AddOutputFilterByType DEFLATE application/javascript application/x-javascript
	AddOutputFilterByType DEFLATE application/json application/xml
	AddOutputFilterByType DEFLATE image/svg+xml
</IfModule>

# Assets are cache-busted with ?v=<filemtime>, so a long max-age is safe:
# any edit changes the query string and browsers refetch.
<IfModule mod_expires.c>
	ExpiresActive On
	ExpiresByType text/css "access plus 1 year"
	ExpiresByType application/javascript "access plus 1 year"
	ExpiresByType image/webp "access plus 1 year"
	ExpiresByType image/jpeg "access plus 1 year"
	ExpiresByType image/png "access plus 1 year"
	ExpiresByType font/woff2 "access plus 1 year"
</IfModule>
